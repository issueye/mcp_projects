<div class="shot">
  <!--INCLUDE:../systems/backdrop.html-->
  <div class="scrim"></div>

  <section class="sm" aria-label="图标库管理">
    <header class="sm-head">
      <span class="sm-title">图标库</span>
      <span class="sm-count">44</span>
      <div class="sm-search focus">
        <svg class="ic ic14"><use href="#ds-ic-search"/></svg>
        <span style="color:var(--ui-ink)">arrowz</span>
      </div>
      <span class="btn primary"><svg class="ic ic14"><use href="#ds-ic-plus"/></svg>新增图标</span>
      <span class="sm-x"><svg class="ic ic14"><use href="#ds-ic-close"/></svg></span>
    </header>

    <div class="sm-body">
      <div class="sm-left">
        <div class="segs">
          <span class="seg on">全部 <b>0</b></span>
          <span class="seg">内置 <b>0</b></span>
          <span class="seg">自定义 <b>0</b></span>
          <span class="seg">已停用 <b>0</b></span>
        </div>
        <div class="sm-list icm-list">
          <div class="list-empty">
            <svg class="ic"><use href="#ds-ic-search"/></svg>
            <b style="font-size:12px;color:var(--ui-ink-2)">没有匹配「arrowz」的图标</b>
            <span style="font-size:11px;color:var(--ui-ink-3);line-height:1.7;max-width:240px;text-align:center">
              试试别名（close / 搜索 / 爱心）或分组名（arrow / action / status / nav / media / data）。
            </span>
          </div>
        </div>
      </div>

      <div class="sm-right">
        <div class="icm-empty">
          <svg class="ic ic28"><use href="#ds-ic-grid"/></svg>
          <b>图标是检索对象，不是设置项</b>
          <p>用名称、别名或分组搜到图标后，右侧会显示 12–24 的尺寸档、两种用法、元信息与 SVG 源码；自定义图标还能直接改 SVG。</p>
          <div style="display:flex;gap:8px;margin-top:4px">
            <span class="btn ghost xs">清除搜索</span>
            <span class="btn xs"><svg class="ic ic14"><use href="#ds-ic-plus"/></svg>新增图标</span>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
